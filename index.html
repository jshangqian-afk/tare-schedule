<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, initial-scale=1.0">
  <title>タレ製造スケジュール - KimFoods</title>
  <style>
    :root {
      --color-batch1-bg: #EEEDFE;
      --color-batch1-text: #26215C;
      --color-batch2-bg: #E1F5EE;
      --color-batch2-text: #04342C;
      --color-simultaneous: #FAEEDA;
      --color-primary-text: #333;
      --color-button-primary: #3B82F6;
      --color-button-danger: #EF4444;
      --color-button-success: #10B981;
      --color-button-secondary: #6B7280;
      --color-border: #D1D5DB;
      --color-bg: #F9FAFB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--color-primary-text);
      background: var(--color-bg);
      font-size: 16px;
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    .screen {
      padding: 16px 24px 32px;
      max-width: 1024px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--color-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .current-time {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .current-time .label {
      color: #6B7280;
      font-size: 14px;
    }

    #current-time-display {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* 入力エリア */
    .input-section {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .pattern-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .pattern-btn {
      flex: 1;
      min-height: 52px;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid var(--color-border);
      background: white;
      color: var(--color-primary-text);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pattern-btn.active {
      background: var(--color-button-primary);
      color: white;
      border-color: var(--color-button-primary);
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .form-row > label {
      min-width: 140px;
      font-weight: 600;
    }

    .tare-types-row {
      gap: 32px;
    }

    .tare-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tare-group > label {
      font-weight: 600;
    }

    .radio-group {
      display: flex;
      gap: 8px;
    }

    .radio-group label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border: 2px solid var(--color-border);
      border-radius: 6px;
      cursor: pointer;
      min-height: 44px;
      background: white;
    }

    .radio-group label:has(input:checked) {
      background: var(--color-batch1-bg);
      border-color: var(--color-batch1-text);
      color: var(--color-batch1-text);
      font-weight: 700;
    }

    #tare-group-2 .radio-group label:has(input:checked) {
      background: var(--color-batch2-bg);
      border-color: var(--color-batch2-text);
      color: var(--color-batch2-text);
    }

    .radio-group input[type="radio"] {
      width: 18px;
      height: 18px;
    }

    input[type="time"],
    input[type="date"] {
      font-size: 20px;
      padding: 8px 12px;
      border: 2px solid var(--color-border);
      border-radius: 6px;
      min-height: 48px;
      font-variant-numeric: tabular-nums;
      background: white;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      min-height: 48px;
      padding: 0 22px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: opacity 0.15s;
    }

    .btn:active { opacity: 0.7; }

    .btn-primary   { background: var(--color-button-primary); }
    .btn-success   { background: var(--color-button-success); }
    .btn-danger    { background: var(--color-button-danger); }
    .btn-secondary { background: var(--color-button-secondary); }

    /* スケジュール表示 */
    .schedule-section:empty {
      display: none;
    }

    .schedule-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .schedule-pair.single {
      grid-template-columns: 1fr;
      max-width: 520px;
    }

    .schedule-card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .schedule-header {
      padding: 10px 16px;
      font-size: 16px;
      font-weight: 700;
    }

    .schedule-header.batch1 {
      background: var(--color-batch1-bg);
      color: var(--color-batch1-text);
    }

    .schedule-header.batch2 {
      background: var(--color-batch2-bg);
      color: var(--color-batch2-text);
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
    }

    .schedule-table tr {
      border-top: 1px solid var(--color-border);
    }

    .schedule-table tr.simultaneous {
      background: var(--color-simultaneous);
    }

    .schedule-table tr.simultaneous .time::after {
      content: " ●";
      color: #B45309;
      font-size: 14px;
    }

    .schedule-table td {
      padding: 14px 18px;
    }

    .schedule-table td.time {
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      width: 130px;
      border-right: 1px solid var(--color-border);
      color: var(--color-primary-text);
    }

    .schedule-table td.phase {
      font-size: 18px;
    }

    /* マスター管理画面 */
    .master-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      min-height: 48px;
      font-size: 16px;
      font-weight: 600;
      background: white;
      color: var(--color-primary-text);
      border: 2px solid var(--color-border);
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--color-button-primary);
      color: white;
      border-color: var(--color-button-primary);
    }

    .master-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .master-table th,
    .master-table td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--color-border);
      text-align: left;
      vertical-align: middle;
    }

    .master-table th {
      background: #F3F4F6;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.3;
    }

    .master-table tbody tr:last-child td {
      border-bottom: none;
    }

    .master-table input[type="text"],
    .master-table input[type="number"],
    .master-table select {
      width: 100%;
      min-height: 40px;
      font-size: 16px;
      padding: 6px 8px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: white;
    }

    .master-table .empty-row td {
      text-align: center;
      color: #9CA3AF;
      padding: 24px;
    }

    /* 原価まわり */
    .master-table th.num,
    .master-table td.num {
      text-align: right;
    }

    .master-table .cost {
      font-size: 17px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .master-table .cost .unit-price {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #6B7280;
    }

    .master-table .cost.warn {
      font-size: 12px;
      font-weight: 600;
      color: #B45309;
      white-space: normal;
    }

    .master-table tfoot td {
      background: #F3F4F6;
      border-top: 2px solid var(--color-border);
      border-bottom: none;
      font-weight: 700;
      font-size: 15px;
    }

    .master-table tfoot .total-value {
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .cost-note {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 400;
      color: #B45309;
    }

    .master-hint {
      font-size: 13px;
      line-height: 1.6;
      color: #6B7280;
      margin-bottom: 10px;
    }

    /* メイン画面の原価サマリー */
    .cost-summary {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 14px 20px;
      margin-top: 16px;
      max-width: 520px;
    }

    .cost-summary h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .cost-summary table {
      width: 100%;
      border-collapse: collapse;
    }

    .cost-summary td {
      padding: 6px 0;
      font-size: 16px;
    }

    .cost-summary td.amount {
      text-align: right;
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .cost-summary tr.total td {
      border-top: 2px solid var(--color-border);
      padding-top: 10px;
      font-size: 18px;
    }

    .cost-summary tr.total td.amount {
      font-size: 24px;
    }

    .btn-small {
      min-height: 36px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }

    .btn-small.btn-danger { background: var(--color-button-danger); }
  </style>
</head>
<body>

<!-- メイン画面 -->
<div id="main-screen" class="screen">
  <header>
    <h1>タレ製造スケジュール</h1>
    <div class="current-time">
      <span class="label">現在時刻</span>
      <span id="current-time-display">--:--</span>
    </div>
  </header>

  <section class="input-section">
    <div class="pattern-selector">
      <button class="pattern-btn" data-pattern="①">パターン①(1回)</button>
      <button class="pattern-btn" data-pattern="②">パターン②(2回連続)</button>
    </div>

    <div class="form-row">
      <label for="production-date">製造日</label>
      <input type="date" id="production-date">
    </div>

    <div class="form-row">
      <label for="start-time">スタート時刻</label>
      <input type="time" id="start-time" value="09:00">
    </div>

    <div class="form-row tare-types-row">
      <div class="tare-group" id="tare-group-1">
        <label>タレ種類(1回目)</label>
        <div class="radio-group">
          <label><input type="radio" name="tare1" value="A" checked> Aタレ</label>
          <label><input type="radio" name="tare1" value="B"> Bタレ</label>
          <label><input type="radio" name="tare1" value="C"> Cタレ</label>
        </div>
      </div>
      <div class="tare-group" id="tare-group-2" style="display:none">
        <label>タレ種類(2回目)</label>
        <div class="radio-group">
          <label><input type="radio" name="tare2" value="A" checked> Aタレ</label>
          <label><input type="radio" name="tare2" value="B"> Bタレ</label>
          <label><input type="radio" name="tare2" value="C"> Cタレ</label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="btn-create" class="btn btn-primary">スケジュール作成</button>
      <button id="btn-start" class="btn btn-success">製造開始</button>
      <button id="btn-reset" class="btn btn-danger">リセット</button>
      <button id="btn-master" class="btn btn-secondary">マスター管理画面へ</button>
    </div>
  </section>

  <section id="schedule-section" class="schedule-section"></section>

  <section id="cost-summary" class="cost-summary" style="display:none"></section>
</div>

<!-- マスター管理画面 -->
<div id="master-screen" class="screen" style="display:none">
  <header>
    <h1>原材料マスター管理</h1>
    <button id="btn-back" class="btn btn-secondary">メイン画面に戻る</button>
  </header>

  <div class="master-tabs">
    <button class="tab-btn" data-tare="A">Aタレ</button>
    <button class="tab-btn" data-tare="B">Bタレ</button>
    <button class="tab-btn" data-tare="C">Cタレ</button>
  </div>

  <!-- 単位の入力候補(自由入力も可) -->
  <datalist id="unit-options">
    <option value="g"></option>
    <option value="kg"></option>
    <option value="mL"></option>
    <option value="L"></option>
    <option value="個"></option>
    <option value="本"></option>
    <option value="袋"></option>
    <option value="ポリ"></option>
    <option value="缶"></option>
    <option value="箱"></option>
    <option value="ケース"></option>
  </datalist>

  <p class="master-hint">
    <strong>単価</strong>は仕入れの単価を<strong>税抜</strong>で入力してください
    (例: 日本酒 1ポリ = 3,200円 → 単価 3200 / 単位 ポリ、昆布だし 1kg = 850円 → 単価 850 / 単位 kg)。<br>
    1バッチ使用量から <em>使用量 × 単価</em> で原価を自動計算します。単価の単位が空欄のときは使用量と同じ単位とみなします。
  </p>

  <table class="master-table">
    <thead>
      <tr>
        <th>原材料名</th>
        <th style="width:100px">1バッチ<br>使用量</th>
        <th style="width:90px">単位</th>
        <th style="width:120px">単価<br>(税抜・円)</th>
        <th style="width:100px">単価の単位</th>
        <th class="num" style="width:130px">原価(税抜)</th>
        <th style="width:80px"></th>
      </tr>
    </thead>
    <tbody id="master-tbody"></tbody>
    <tfoot id="master-tfoot"></tfoot>
  </table>

  <div class="actions">
    <button id="btn-add-row" class="btn btn-secondary">+ 行追加</button>
    <button id="btn-save-master" class="btn btn-primary">保存</button>
    <button id="btn-cancel-master" class="btn btn-danger">キャンセル</button>
  </div>
</div>

<script>
  'use strict';

  // === 定数 ===
  const PHASES = [
    { name: '水飴点火',     offset: 0 },
    { name: '回転釜点火',   offset: 60 },
    { name: '出汁開始',     offset: 110 },
    { name: 'タレ開始',     offset: 130 },
    { name: 'タレ取り出し', offset: 210 }
  ];

  const BATCH2_START_OFFSET = 110;

  const STORAGE_KEYS = {
    pattern:   'tare_pattern',
    startTime: 'tare_startTime',
    tareTypes: 'tare_types',
    schedule:  'tare_schedule'
  };

  // GAS WebApp URL (Phase 2)
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbz61IhIdwaO_cHSaZAh1yiEf2AilOncis9_o66GaGhNt9e72OCqSUpM7uNvg8qCZAKsuA/exec';

  // === 状態 ===
  let state = {
    pattern:   '①',
    startTime: '09:00',
    tareTypes: ['A'],
    schedule:  null,
    productionDate: ''   // 製造日 'yyyy-MM-dd'(既定は当日。過去日付の記録に対応)
  };

  // 今日の日付を 'yyyy-MM-dd' で返す
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // 原材料マスター(GAS から取得)
  let master = { A: [], B: [], C: [] };
  let masterLoaded = false;
  let currentMasterTab = 'A';

  function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  // === 原価計算 ===

  // 単位表記の揺れ(全角・大文字小文字・前後空白)を吸収する
  function normUnit(u) {
    return String(u || '')
      .replace(/[Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .trim()
      .toLowerCase();
  }

  // 重さ・容量の換算表(基準: g / mL)
  const UNIT_BASE = {
    g:  { base: 'weight', factor: 1 },
    kg: { base: 'weight', factor: 1000 },
    ml: { base: 'volume', factor: 1 },
    cc: { base: 'volume', factor: 1 },
    l:  { base: 'volume', factor: 1000 }
  };

  // 使用量の単位 → 単価の単位 への換算係数。換算できない組み合わせは null
  function unitFactor(useUnit, priceUnit) {
    const a = normUnit(useUnit);
    const b = normUnit(priceUnit) || a;   // 単価の単位が空欄なら使用量と同じ単位とみなす
    if (a === b) return 1;
    const ua = UNIT_BASE[a];
    const ub = UNIT_BASE[b];
    if (!ua || !ub || ua.base !== ub.base) return null;
    return ua.factor / ub.factor;
  }

  // 原材料1件の1バッチ原価(税抜)
  //   原価 = 使用量(単価の単位に換算) × 単価
  // 戻り値: { cost } または { error: '未入力' | '単位不一致' }
  function calcCost(item) {
    const price = Number(item.unitPrice) || 0;
    if (price <= 0) return { error: '未入力' };
    const factor = unitFactor(item.unit, item.priceUnit);
    if (factor === null) return { error: '単位不一致' };
    return { cost: (Number(item.amount) || 0) * factor * price };
  }

  // タレ1バッチ分の原価合計。計算できなかった件数も返す
  function calcTotalCost(list) {
    let total = 0, missing = 0, mismatch = 0;
    (list || []).forEach(item => {
      if (!item.name || !String(item.name).trim()) return;
      const r = calcCost(item);
      if (r.error === '未入力') missing++;
      else if (r.error === '単位不一致') mismatch++;
      else total += r.cost;
    });
    return { total: total, missing: missing, mismatch: mismatch };
  }

  function formatYen(n) {
    return '¥' + Math.round(n).toLocaleString('ja-JP');
  }

  // === GAS API ===

  async function apiGet(action, params) {
    const url = new URL(GAS_URL);
    url.searchParams.set('action', action);
    if (params) {
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    }
    const res = await fetch(url.toString());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function apiPost(body) {
    // Content-Type を指定しない(text/plain 扱いでプリフライト回避)
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  // === 時刻計算 ===

  // 'HH:MM' → 分(0-1439)
  function timeToMin(str) {
    const [h, m] = str.split(':').map(Number);
    return h * 60 + m;
  }

  // 分 → 'HH:MM'(日付またぎは考慮しない)
  function minToTime(total) {
    const h = Math.floor(total / 60) % 24;
    const m = total % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  }

  // バッチの工程リストを作成
  function makeBatch(startMin) {
    return PHASES.map(p => ({
      name:    p.name,
      time:    minToTime(startMin + p.offset),
      minutes: startMin + p.offset
    }));
  }

  // スケジュール計算
  function calculateSchedule(startTime, pattern, tareTypes) {
    const startMin = timeToMin(startTime);
    const batch1   = makeBatch(startMin);

    if (pattern === '①') {
      return { pattern, tareTypes, batch1 };
    }

    const batch2 = makeBatch(startMin + BATCH2_START_OFFSET);
    return { pattern, tareTypes, batch1, batch2 };
  }

  // === 描画 ===

  function renderSchedule(sched) {
    const section = document.getElementById('schedule-section');
    renderCostSummary(sched);
    if (!sched) {
      section.innerHTML = '';
      return;
    }

    if (sched.pattern === '①') {
      section.innerHTML = `
        <div class="schedule-pair single">
          ${renderCard(sched.batch1, [], 'batch1', `${sched.tareTypes[0]}タレ (1回目)`)}
        </div>
      `;
      return;
    }

    section.innerHTML = `
      <div class="schedule-pair">
        ${renderCard(sched.batch1, sched.batch2, 'batch1', `1回目 (${sched.tareTypes[0]}タレ)`)}
        ${renderCard(sched.batch2, sched.batch1, 'batch2', `2回目 (${sched.tareTypes[1]}タレ)`)}
      </div>
    `;
  }

  // ownBatch と otherBatch を比較し、同時刻のセルに simultaneous クラスを付ける
  function renderCard(ownBatch, otherBatch, headerClass, headerLabel) {
    const otherTimes = new Set(otherBatch.map(r => r.minutes));
    const rows = ownBatch.map(row => {
      const simultaneous = otherTimes.has(row.minutes);
      return `
        <tr class="${simultaneous ? 'simultaneous' : ''}">
          <td class="time">${row.time}</td>
          <td class="phase">${row.name}</td>
        </tr>
      `;
    }).join('');

    return `
      <div class="schedule-card">
        <div class="schedule-header ${headerClass}">${headerLabel}</div>
        <table class="schedule-table">${rows}</table>
      </div>
    `;
  }

  // メイン画面: 表示中のスケジュールに対する原材料費(税抜)を表示
  function renderCostSummary(sched) {
    const box = document.getElementById('cost-summary');
    if (!box) return;
    if (!sched || !masterLoaded) {
      box.style.display = 'none';
      box.innerHTML = '';
      return;
    }

    const labels = sched.pattern === '①' ? ['1回目'] : ['1回目', '2回目'];
    let total = 0;
    let hasNote = false;
    const rows = labels.map((label, i) => {
      const type = sched.tareTypes[i] || 'A';
      const sum  = calcTotalCost(master[type]);
      total += sum.total;
      if (sum.missing || sum.mismatch) hasNote = true;
      return `<tr><td>${label}(${escapeAttr(type)}タレ)</td><td class="amount">${formatYen(sum.total)}</td></tr>`;
    }).join('');

    box.innerHTML = `
      <h2>原材料費(税抜)</h2>
      <table>
        ${rows}
        <tr class="total"><td>合計</td><td class="amount">${formatYen(total)}</td></tr>
      </table>
      ${hasNote ? '<span class="cost-note">※ 単価が未入力、または単位を換算できない原材料は含んでいません(マスター管理画面で確認してください)</span>' : ''}
    `;
    box.style.display = '';
  }

  // 現在時刻表示(1分ごとに更新)
  function updateCurrentTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('current-time-display').textContent = `${h}:${m}`;
  }

  // === localStorage ===

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEYS.pattern,   state.pattern);
      localStorage.setItem(STORAGE_KEYS.startTime, state.startTime);
      localStorage.setItem(STORAGE_KEYS.tareTypes, JSON.stringify(state.tareTypes));
      if (state.schedule) {
        localStorage.setItem(STORAGE_KEYS.schedule, JSON.stringify(state.schedule));
      } else {
        localStorage.removeItem(STORAGE_KEYS.schedule);
      }
    } catch (e) {
      console.warn('localStorage 保存に失敗:', e);
    }
  }

  function loadState() {
    try {
      const pattern   = localStorage.getItem(STORAGE_KEYS.pattern);
      const startTime = localStorage.getItem(STORAGE_KEYS.startTime);
      const tareTypes = localStorage.getItem(STORAGE_KEYS.tareTypes);
      const schedule  = localStorage.getItem(STORAGE_KEYS.schedule);

      if (pattern)   state.pattern   = pattern;
      if (startTime) state.startTime = startTime;
      if (tareTypes) state.tareTypes = JSON.parse(tareTypes);
      if (schedule)  state.schedule  = JSON.parse(schedule);
    } catch (e) {
      console.warn('localStorage 読み込みに失敗:', e);
    }
  }

  function clearStorage() {
    Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
  }

  // 状態をUIに反映
  function applyStateToUI() {
    document.querySelectorAll('.pattern-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.pattern === state.pattern);
    });
    document.getElementById('tare-group-2').style.display =
      state.pattern === '②' ? '' : 'none';

    document.getElementById('start-time').value = state.startTime;

    const t1 = document.querySelector(`input[name="tare1"][value="${state.tareTypes[0] || 'A'}"]`);
    if (t1) t1.checked = true;
    const t2 = document.querySelector(`input[name="tare2"][value="${state.tareTypes[1] || 'A'}"]`);
    if (t2) t2.checked = true;

    renderSchedule(state.schedule);
  }

  // 入力値を state に取り込む
  function collectInput() {
    state.startTime = document.getElementById('start-time').value || '09:00';
    state.productionDate = document.getElementById('production-date').value || todayStr();
    const t1 = document.querySelector('input[name="tare1"]:checked');
    state.tareTypes = [t1 ? t1.value : 'A'];
    if (state.pattern === '②') {
      const t2 = document.querySelector('input[name="tare2"]:checked');
      state.tareTypes.push(t2 ? t2.value : 'A');
    }
  }

  // === マスター管理画面 ===

  function renderMasterTable() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tare === currentMasterTab);
    });

    const tbody = document.getElementById('master-tbody');
    const list = master[currentMasterTab];

    if (!list || list.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="7">原材料が登録されていません。「+ 行追加」を押してください。</td></tr>`;
      renderMasterFooter();
      return;
    }

    tbody.innerHTML = list.map((item, i) => `
      <tr>
        <td><input type="text"   data-field="name"   data-index="${i}" value="${escapeAttr(item.name)}"></td>
        <td><input type="number" data-field="amount" data-index="${i}" value="${item.amount}" step="0.1" min="0"></td>
        <td>
          <input type="text" list="unit-options" data-field="unit" data-index="${i}"
                 value="${escapeAttr(item.unit)}" placeholder="kg">
        </td>
        <td><input type="number" data-field="unitPrice" data-index="${i}"
                   value="${item.unitPrice || ''}" step="1" min="0" placeholder="0"></td>
        <td>
          <input type="text" list="unit-options" data-field="priceUnit" data-index="${i}"
                 value="${escapeAttr(item.priceUnit || '')}" placeholder="${escapeAttr(item.unit || '単位')}">
        </td>
        <td class="num" data-cost-cell>${costCellHtml(item)}</td>
        <td><button class="btn-small btn-danger" data-action="delete" data-index="${i}">削除</button></td>
      </tr>
    `).join('');

    renderMasterFooter();
  }

  // 原価セル1つ分のHTML
  function costCellHtml(item) {
    const r = calcCost(item);
    if (r.error === '未入力')     return `<span class="cost warn">単価が未入力</span>`;
    if (r.error === '単位不一致') return `<span class="cost warn">単位を換算できません</span>`;
    return `<span class="cost">${formatYen(r.cost)}</span>`;
  }

  // マスター表のフッター(1バッチ原価合計)を描画
  function renderMasterFooter() {
    const tfoot = document.getElementById('master-tfoot');
    const sum = calcTotalCost(master[currentMasterTab]);

    const notes = [];
    if (sum.missing)  notes.push(`単価が未入力 ${sum.missing}件`);
    if (sum.mismatch) notes.push(`単位を換算できない行 ${sum.mismatch}件`);

    tfoot.innerHTML = `
      <tr>
        <td colspan="5">
          ${currentMasterTab}タレ 1バッチの原価合計(税抜)
          ${notes.length ? `<span class="cost-note">※ ${notes.join(' / ')} は含んでいません</span>` : ''}
        </td>
        <td class="num total-value">${formatYen(sum.total)}</td>
        <td></td>
      </tr>
    `;
  }

  // 入力中の focus を壊さないよう、原価セルと合計だけを再計算する
  function refreshCosts() {
    const list = master[currentMasterTab] || [];
    document.querySelectorAll('#master-tbody tr').forEach((tr, i) => {
      const item = list[i];
      if (!item) return;
      const cell = tr.querySelector('[data-cost-cell]');
      if (cell) cell.innerHTML = costCellHtml(item);
      const priceUnitInput = tr.querySelector('input[data-field="priceUnit"]');
      if (priceUnitInput) priceUnitInput.placeholder = String(item.unit || '単位');
    });
    renderMasterFooter();
  }

  function escapeAttr(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  // GAS のレスポンスを、原価計算に必要な項目が必ず揃った形に正規化する
  function normalizeIngredients(arr) {
    return (Array.isArray(arr) ? arr : []).map(it => ({
      name:      String(it.name || ''),
      amount:    Number(it.amount) || 0,
      unit:      String(it.unit || ''),
      unitPrice: Number(it.unitPrice) || 0,
      priceUnit: String(it.priceUnit || '')
    }));
  }

  // GAS からマスターを取得して画面を更新。
  // silent = true のときはマスター表を触らず、原価表示用に裏で読み込むだけ。
  async function loadMasterFromGas(silent) {
    const tbody = document.getElementById('master-tbody');
    if (!silent) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="7">読み込み中...</td></tr>`;
    }
    try {
      const json = await apiGet('getMaster');
      if (!json.success) throw new Error(json.error || '取得に失敗しました');
      master = {
        A: normalizeIngredients(json.data && json.data.A),
        B: normalizeIngredients(json.data && json.data.B),
        C: normalizeIngredients(json.data && json.data.C)
      };
      masterLoaded = true;
      if (!silent) renderMasterTable();
      renderCostSummary(state.schedule);
    } catch (e) {
      if (silent) {
        console.warn('マスターの先読みに失敗:', e);
      } else {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="7">取得失敗: ${escapeAttr(e.message)}</td></tr>`;
      }
    }
  }

  // === イベント登録 ===

  document.addEventListener('DOMContentLoaded', () => {
    loadState();
    applyStateToUI();
    updateCurrentTime();
    setInterval(updateCurrentTime, 60 * 1000);

    // 製造日は毎回「当日」を初期値にし、未来日は選べないようにする
    // (過去日付は手動で選択して記録可能)
    const dateInput = document.getElementById('production-date');
    dateInput.max = todayStr();
    dateInput.value = todayStr();
    state.productionDate = dateInput.value;

    // 原材料費を表示するため、マスターを裏で先読みする(失敗しても画面は動く)
    loadMasterFromGas(true);

    // パターン切替
    document.querySelectorAll('.pattern-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.pattern  = btn.dataset.pattern;
        state.schedule = null;
        applyStateToUI();
        saveState();
      });
    });

    // タレ種類変更(即時保存)
    document.querySelectorAll('input[name="tare1"], input[name="tare2"]').forEach(r => {
      r.addEventListener('change', () => {
        collectInput();
        saveState();
      });
    });

    // スタート時刻変更(即時保存)
    document.getElementById('start-time').addEventListener('change', () => {
      state.startTime = document.getElementById('start-time').value || '09:00';
      saveState();
    });

    // スケジュール作成
    document.getElementById('btn-create').addEventListener('click', () => {
      collectInput();
      if (!state.startTime) {
        alert('スタート時刻を入力してください');
        return;
      }
      state.schedule = calculateSchedule(state.startTime, state.pattern, state.tareTypes);
      renderSchedule(state.schedule);
      saveState();
    });

    // 製造開始(GAS に送信)
    document.getElementById('btn-start').addEventListener('click', async () => {
      collectInput();
      if (!state.schedule) {
        alert('先に「スケジュール作成」を押してください。');
        return;
      }
      const dateLabel = state.productionDate === todayStr()
        ? state.productionDate + '(本日)'
        : state.productionDate + '(過去日付)';
      if (!confirm('製造開始を記録しますか?\n製造日: ' + dateLabel + '\nスプレッドシートに製造実績と原材料出庫が追記されます。')) return;

      const btn = document.getElementById('btn-start');
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = '送信中...';
      try {
        const json = await apiPost({
          action:    'saveProduction',
          productionDate: state.productionDate,
          pattern:   state.pattern,
          startTime: state.startTime,
          tareTypes: state.tareTypes
        });
        if (!json.success) throw new Error(json.error || '保存に失敗しました');
        alert('製造開始を記録しました\n製造ID: ' + (json.productionIds || []).join(', '));
      } catch (e) {
        alert('送信失敗: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    });

    // リセット
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (!confirm('入力と表示をすべてクリアしますか?')) return;
      clearStorage();
      state = {
        pattern:   '①',
        startTime: '09:00',
        tareTypes: ['A'],
        schedule:  null,
        productionDate: todayStr()
      };
      const dateInput = document.getElementById('production-date');
      dateInput.max = todayStr();
      dateInput.value = todayStr();
      applyStateToUI();
    });

    // マスター画面遷移(初回のみ GAS から取得)
    document.getElementById('btn-master').addEventListener('click', async () => {
      document.getElementById('main-screen').style.display = 'none';
      document.getElementById('master-screen').style.display = '';
      currentMasterTab = 'A';
      if (!masterLoaded) {
        await loadMasterFromGas();
      } else {
        renderMasterTable();
      }
    });

    document.getElementById('btn-back').addEventListener('click', () => {
      document.getElementById('master-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = '';
    });

    // タレ種類タブ
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentMasterTab = btn.dataset.tare;
        renderMasterTable();
      });
    });

    // マスター編集(input)。数値欄・文字欄それぞれを state に反映し、原価を再計算する
    const NUM_FIELDS  = ['amount', 'unitPrice'];
    const TEXT_FIELDS = ['name', 'unit', 'priceUnit'];  // 単位は自由入力(datalist で補完)
    const tbody = document.getElementById('master-tbody');
    tbody.addEventListener('input', (e) => {
      const idx = parseInt(e.target.dataset.index, 10);
      const field = e.target.dataset.field;
      if (isNaN(idx) || !field) return;
      const item = master[currentMasterTab][idx];
      if (!item) return;
      if (NUM_FIELDS.includes(field)) {
        item[field] = parseFloat(e.target.value) || 0;
      } else if (TEXT_FIELDS.includes(field)) {
        item[field] = e.target.value;
      } else {
        return;
      }
      refreshCosts();
    });

    // 削除ボタン
    tbody.addEventListener('click', (e) => {
      if (e.target.dataset.action !== 'delete') return;
      const idx = parseInt(e.target.dataset.index, 10);
      master[currentMasterTab].splice(idx, 1);
      renderMasterTable();
    });

    // 行追加
    document.getElementById('btn-add-row').addEventListener('click', () => {
      master[currentMasterTab].push({
        name: '', amount: 0, unit: 'kg', unitPrice: 0, priceUnit: ''
      });
      renderMasterTable();
    });

    // マスター保存(現在のタブのみ GAS に送信)
    document.getElementById('btn-save-master').addEventListener('click', async () => {
      const btn = document.getElementById('btn-save-master');
      const tareType = currentMasterTab;
      const ingredients = (master[tareType] || [])
        .filter(i => i.name && String(i.name).trim() !== '');

      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = '保存中...';
      try {
        const json = await apiPost({
          action:      'saveMaster',
          tareType:    tareType,
          ingredients: ingredients
        });
        if (!json.success) throw new Error(json.error || '保存に失敗しました');
        // 保存後は GAS の値を真として再読込
        master[tareType] = clone(ingredients);
        // 名前が空の行は保存対象外なので、表と原価表示を保存後の内容に合わせ直す
        if (tareType === currentMasterTab) renderMasterTable();
        renderCostSummary(state.schedule);
        alert(tareType + 'タレのマスターを保存しました(' + (json.count != null ? json.count : ingredients.length) + ' 件)');
      } catch (e) {
        alert('保存失敗: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    });

    // マスターキャンセル(GAS から再取得して変更を破棄)
    document.getElementById('btn-cancel-master').addEventListener('click', async () => {
      if (!confirm('変更を破棄して最新のデータを再取得しますか?')) return;
      await loadMasterFromGas();
    });
  });
</script>

</body>
</html>
